<style>
  :root{--bg:#0d1117;--brd:#1f2630;--dim:#4a5261;--txt:#c9d1d9;--acc:#00d4a0;--hi:#e3a857;
        --g1:#1f4d44;--g2:#2f7f6c;--g3:#00d4a0;--g4:#9df5df}
  @media (prefers-color-scheme: light){
    :root{--bg:#ffffff;--brd:#d8dee4;--dim:#8c959f;--txt:#24292f;--acc:#087f5b;--hi:#b8860b;
          --g1:#bfe3d8;--g2:#6bbfa8;--g3:#0b9c7d;--g4:#04624e}
  }
  text{white-space:pre}
  .dim{fill:var(--dim)} .txt{fill:var(--txt)} .acc{fill:var(--acc)} .hi{fill:var(--hi)}
  .g1{fill:var(--g1)} .g2{fill:var(--g2)} .g3{fill:var(--g3)} .g4{fill:var(--g4)}
  .ln{opacity:0;animation:fade .4s ease forwards}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sl{opacity:0;animation:slide .4s ease forwards}
  @keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .cur{animation:blink 1.15s step-end infinite;animation-delay:3s;opacity:0}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
